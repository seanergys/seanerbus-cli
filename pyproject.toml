[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"
[project]
dependencies = [
    "seanerbus",
]
requires-python = ">= 3.10"
name = "seanerbus-cli"
version = "0.0.1"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]

[tool.uv.sources]
seanerbus = { git = "ssh://git@gitlab.seanergys.fz-juelich.de/software/seanerbus-py.git" }

[project.scripts]

seanerbus = "seanerbus_cli:main"
